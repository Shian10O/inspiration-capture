<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>修复手机上传回执</title><link rel="stylesheet" href="style.css"><body><main style="max-width:720px;margin:32px auto;padding:20px"><h1>修复手机上传回执</h1><p>适用于手机提示未确认，但服务端已保存的情况。此修复包只更新快捷脚本和回执组件，保留当前设备授权、原侧边栏入口及待上传队列。</p><button id="download-repair" class="primary" type="button">下载回执修复包</button><p id="status" role="status"></p><div id="download"></div><ol><li>在 HTTP Shortcuts → 导入／导出 → 从文件导入，选下载的 ZIP，选择「合并」。</li><li>在 HTTP Shortcuts 点「重试待上传灵感」，沿用原记录核对，不必再复制链接或填写评论。</li></ol><p>成功显示「已上传到 Notion」。如果仍未确认，保留原记录并反馈提示文字；不需要重新生成设备授权。</p><a href="/">返回网页收集入口</a><script type="module" src="phone-repair.js"></script></main></body></html>
