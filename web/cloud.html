<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>灵感入口 · Notion 收件箱</title><link rel="stylesheet" href="style.css"><body><header><span class="brand">✦ 灵感入口</span><a href="/setup">连接与设备授权</a></header><main style="max-width:900px"><h1>先收下，再整理。</h1><p>链接、文字、个人评论先进入 Notion 收件箱。分类与取舍由你决定。</p><section class="capture-card"><form id="cloud-capture"><label for="raw">原始链接、分享文字或内容</label><textarea id="raw" rows="6" required maxlength="16000" placeholder="粘贴链接、文字或点点已有总结"></textarea><label for="url">原文链接（可选；补充总结时填原来的链接）</label><input id="url" type="url" maxlength="2000" style="width:100%;padding:10px"><label for="comment">我的一句话（可不填）</label><textarea id="comment" rows="2" maxlength="4000"></textarea><label><input id="diandian" type="checkbox">这是点点已经生成的总结，由我粘贴</label><div class="save-row"><button id="submit" class="primary" type="submit">写入 Notion</button><button id="retry" type="button">重试待提交</button></div></form><p id="feedback" role="status"></p></section><p><a href="https://app.notion.com/p/22222222222242228222222222222222" target="_blank" rel="noreferrer">打开统一 Notion 测试收件箱 ↗</a> · <a href="/local">查看原来的本地原型</a></p><p>图片上传将在后续阶段接入，此页暂不收图片。旧浏览器和手机测试箱中的记录不会自动上传。</p><h2>最近的提交回执</h2><div id="events"></div><script src="cloud.js"></script></main></body></html>
